        function dekodB64(b64) {
            const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
            return new TextDecoder("utf-8").decode(bytes);
        }

        function oppdaterTidstekst() {
            const naa = new Date();
            const dag = naa.getDay(); 
            const timeVal = naa.getHours() * 100 + naa.getMinutes();

            const ukedager = [
                "Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"
            ];
            const timer = String(naa.getHours()).padStart(2, "0");
            const minutter = String(naa.getMinutes()).padStart(2, "0");

            document.getElementById("current-time").innerText =
                `Det er ${ukedager[dag]} ${timer}:${minutter}`;

            const dagListe = tidstabell[dag] || tidstabell[1];
            
            let aktuellMelding = dagListe[0].tekst;
            for (let i = 0; i < dagListe.length; i++) {
                if (timeVal >= dagListe[i].tid) {
                    aktuellMelding = dagListe[i].tekst;
                }
            }

            document.getElementById("dynamic-text").innerText = dekodB64(aktuellMelding);
        }

        let forrigeUnnskyldning = -1;

        function nyUnnskyldning() {
            if (!unnskyldninger.length) return;
            let tilfeldigIndex;
            if (unnskyldninger.length === 1) {
                tilfeldigIndex = 0;
            } else if (forrigeUnnskyldning < 0) {
                tilfeldigIndex = Math.floor(Math.random() * unnskyldninger.length);
            } else {
                tilfeldigIndex = Math.floor(Math.random() * (unnskyldninger.length - 1));
                if (tilfeldigIndex >= forrigeUnnskyldning) tilfeldigIndex++;
            }
            forrigeUnnskyldning = tilfeldigIndex;
            document.getElementById("excuse-text").innerText = dekodB64(unnskyldninger[tilfeldigIndex]);
        }

        // Mål tekstene ved gjeldende bredde, så knappen ikke flytter seg ved klikk.
        function reserverTekstplass() {
            const tekstfelt = document.getElementById("excuse-text");
            const bredde = tekstfelt.getBoundingClientRect().width;
            if (!bredde) return;
            const maalefelt = tekstfelt.cloneNode(false);
            maalefelt.removeAttribute("id");
            maalefelt.removeAttribute("aria-live");
            maalefelt.removeAttribute("aria-atomic");
            maalefelt.setAttribute("aria-hidden", "true");
            Object.assign(maalefelt.style, {
                position: "absolute", visibility: "hidden", pointerEvents: "none",
                width: `${bredde}px`, minHeight: "0", height: "auto",
                left: "0", top: "0"
            });
            tekstfelt.parentNode.appendChild(maalefelt);
            let maksHoyde = 0;
            for (const tekst of unnskyldninger) {
                maalefelt.textContent = dekodB64(tekst);
                maksHoyde = Math.max(maksHoyde, maalefelt.getBoundingClientRect().height);
            }
            maalefelt.remove();
            tekstfelt.style.minHeight = `${Math.ceil(maksHoyde)}px`;
        }

        let minuttTimer;
        function startTidsoppdatering() {
            clearTimeout(minuttTimer);
            oppdaterTidstekst();
            minuttTimer = setTimeout(startTidsoppdatering, 60000 - (Date.now() % 60000));
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) clearTimeout(minuttTimer);
            else startTidsoppdatering();
        });
        window.addEventListener("pageshow", startTidsoppdatering);

        startTidsoppdatering();
        nyUnnskyldning();
        reserverTekstplass();
        let forrigeBredde = document.getElementById("excuse-text").getBoundingClientRect().width;
        if (typeof ResizeObserver !== "undefined") {
            new ResizeObserver(() => {
                const bredde = document.getElementById("excuse-text").getBoundingClientRect().width;
                if (bredde !== forrigeBredde) {
                    forrigeBredde = bredde;
                    reserverTekstplass();
                }
            }).observe(document.querySelector(".excuse-wrapper"));
        } else {
            window.addEventListener("resize", reserverTekstplass);
        }
        if (document.fonts) document.fonts.ready.then(reserverTekstplass);
    </script>
